name: profile art

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Render assets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-all.js

      - name: Commit refreshed art
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo 'assets are already up to date'
            exit 0
          fi
          git add assets
          git commit -m 'chore(profile): refresh generated art'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
