name: profile art

# Re-renders the SVGs in assets/ from live GitHub data.
#
# Token behaviour:
#   * With no secrets configured it runs on the default GITHUB_TOKEN and shows
#     PUBLIC contributions only.
#   * Add a repository secret named GH_PAT (a classic PAT with `read:user`, or a
#     fine-grained token with read access to your profile) and the panel also
#     counts private contributions — provided "Include private contributions on
#     my profile" is enabled under Settings › Public profile.
#
# The job commits daily, which also keeps the schedule alive: GitHub disables
# cron workflows on public repos after 60 days with no repository activity.

on:
  schedule:
    # 02:17 UTC daily — off the hour, since :00 is the busiest slot on GitHub's
    # scheduler and gets delayed the most.
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render assets
        env:
          # GH_PAT is optional; the build falls back to GITHUB_TOKEN, and then
          # to an empty state, rather than failing.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-all.js

      - name: Commit refreshed art
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo 'assets are already up to date'
            exit 0
          fi
          git add assets
          git commit -m 'chore(profile): refresh generated art'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
